<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenClaw">
<meta name="theme-color" content="#0a0a0f">
<title>OpenClaw Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --accent-glow: rgba(124,106,247,0.25);
    --text: #e8e8f0;
    --text-dim: #6b6b88;
    --text-muted: #3a3a55;
    --green: #4ade80;
    --red: #f87171;
    --orange: #fb923c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* ---- LAYOUT ---- */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* ---- HEADER ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(20px);
    background: rgba(10,10,15,0.8);
    flex-shrink: 0;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--text);
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  .logo span { color: var(--accent2); }

  #status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }
  #status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #status-dot.connecting { background: var(--orange); animation: pulse-dot 1s infinite; }
  #status-dot.error { background: var(--red); }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #status-text {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #settings-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  #settings-btn:active { background: var(--surface2); color: var(--text); }

  /* ---- MESSAGES ---- */
  #messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  #messages::-webkit-scrollbar { display: none; }

  .msg {
    display: flex;
    gap: 10px;
    animation: msg-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 100%;
  }

  @keyframes msg-in {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    margin-top: 2px;
  }

  .msg.user .msg-avatar {
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    color: white;
  }

  .msg.assistant .msg-avatar {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent2);
  }

  .msg-body { min-width: 0; max-width: calc(100% - 42px); }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    font-size: 13.5px;
  }

  .msg.user .msg-bubble {
    background: linear-gradient(135deg, var(--accent) 0%, #9f7aea 100%);
    color: white;
    border-radius: 14px 4px 14px 14px;
  }

  .msg.assistant .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px 14px 14px 14px;
  }

  .msg-meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .msg.user .msg-meta { text-align: right; }

  /* voice badge */
  .voice-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--accent2);
    background: rgba(124,106,247,0.1);
    border: 1px solid rgba(124,106,247,0.2);
    border-radius: 20px;
    padding: 2px 8px;
    margin-bottom: 5px;
  }

  /* typing indicator */
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
    width: fit-content;
  }

  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); background: var(--text-muted); }
    30% { transform: translateY(-6px); background: var(--accent2); }
  }

  /* empty state */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
    padding: 40px 20px;
    text-align: center;
  }

  #empty-state .big-icon {
    font-size: 48px;
    opacity: 0.4;
    filter: grayscale(0.5);
  }

  #empty-state p {
    font-size: 12px;
    line-height: 1.7;
    max-width: 240px;
  }

  /* ---- INPUT AREA ---- */
  #input-area {
    border-top: 1px solid var(--border);
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    padding: 12px 16px;
    flex-shrink: 0;
  }

  #transcript-preview {
    font-size: 12px;
    color: var(--accent2);
    font-style: italic;
    padding: 0 4px 8px;
    min-height: 0;
    line-height: 1.5;
    display: none;
  }
  #transcript-preview.visible { display: block; }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  #text-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 42px;
    line-height: 1.5;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  #text-input:focus { border-color: rgba(124,106,247,0.4); }
  #text-input::placeholder { color: var(--text-muted); }

  .btn-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
    transition: all 0.2s;
    -webkit-appearance: none;
  }

  #mic-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  #mic-btn.recording {
    background: var(--red);
    border-color: var(--red);
    color: white;
    box-shadow: 0 0 20px rgba(248,113,113,0.4);
    animation: mic-pulse 1s infinite;
  }
  #mic-btn:active { transform: scale(0.93); }

  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.4); }
    50% { box-shadow: 0 0 0 12px rgba(248,113,113,0); }
  }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    color: white;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  #send-btn:disabled {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    box-shadow: none;
  }
  #send-btn:active:not(:disabled) { transform: scale(0.93); }

  /* ---- SETTINGS PANEL ---- */
  #settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  #settings-overlay.open { display: flex; }

  #settings-panel {
    width: 100%;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 20px 20px calc(20px + var(--safe-bottom));
    animation: slide-up 0.3s cubic-bezier(0.34,1.2,0.64,1);
  }

  @keyframes slide-up {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .panel-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .panel-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 20px;
    color: var(--text);
  }

  .field-group { margin-bottom: 16px; }

  .field-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .field-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  .field-input:focus { border-color: rgba(124,106,247,0.4); }

  .panel-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-primary {
    flex: 1;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary:active { opacity: 0.8; }

  .btn-secondary {
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
  }

  .hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.5;
    font-style: italic;
  }

  /* toast */
  #toast {
    position: fixed;
    bottom: calc(100px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 20px;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-left">
      <div class="logo">Open<span>Claw</span></div>
      <div id="status-dot"></div>
      <div id="status-text">desconectado</div>
    </div>
    <button id="settings-btn" onclick="openSettings()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div id="messages">
    <div id="empty-state">
      <div class="big-icon">🎙️</div>
      <p>Mantén pulsado el micrófono para hablar,<br>o escribe tu mensaje.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="transcript-preview"></div>
    <div class="input-row">
      <button class="btn-circle" id="mic-btn" ontouchstart="startRecording(event)" ontouchend="stopRecording(event)" onmousedown="startRecording(event)" onmouseup="stopRecording(event)">
        🎙️
      </button>
      <textarea id="text-input" placeholder="Escribe un mensaje..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button class="btn-circle" id="send-btn" onclick="sendText()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- Settings -->
<div id="settings-overlay" onclick="closeSettingsOutside(event)">
  <div id="settings-panel">
    <div class="panel-handle"></div>
    <div class="panel-title">Configuración</div>

    <div class="field-group">
      <div class="field-label">WebSocket URL</div>
      <input class="field-input" id="cfg-url" type="url" placeholder="ws://100.84.68.91:18789" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="hint">Tu IP Tailscale o DNS: ws://vnic-zeux.tail9bc019.ts.net:18789</div>
    </div>

    <div class="field-group">
      <div class="field-label">API Key (opcional)</div>
      <input class="field-input" id="cfg-apikey" type="password" placeholder="sk-..." autocomplete="off">
      <div class="hint">Si tu gateway requiere autenticación.</div>
    </div>

    <div class="field-group">
      <div class="field-label">Idioma de voz</div>
      <input class="field-input" id="cfg-lang" type="text" value="es-ES" placeholder="es-ES">
      <div class="hint">Código BCP-47: es-ES, en-US, fr-FR…</div>
    </div>

    <div class="panel-actions">
      <button class="btn-secondary" onclick="closeSettings()">Cancelar</button>
      <button class="btn-primary" onclick="saveSettings()">Guardar y conectar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ---- CONFIG ----
const CFG_KEY = 'openclaw_cfg';
let cfg = { url: '', apikey: '', lang: 'es-ES' };

function loadCfg() {
  try {
    const s = localStorage.getItem(CFG_KEY);
    if (s) cfg = { ...cfg, ...JSON.parse(s) };
  } catch(e) {}
}

function saveCfg() {
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
}

// ---- WEBSOCKET ----
let ws = null;
let wsReconnectTimer = null;
let currentAssistantMsg = null;

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = state;
  txt.textContent = text;
}

function connect() {
  if (!cfg.url) {
    setStatus('error', 'sin URL — configura primero');
    return;
  }
  if (ws) { ws.close(); ws = null; }
  clearTimeout(wsReconnectTimer);

  setStatus('connecting', 'conectando…');
  try {
    ws = new WebSocket(cfg.url);
  } catch(e) {
    setStatus('error', 'URL inválida');
    return;
  }

  ws.onopen = () => {
    setStatus('connected', cfg.url.replace('ws://', '').replace('wss://', ''));
    showToast('✓ Conectado a OpenClaw');
  };

  ws.onmessage = (e) => {
    handleWsMessage(e.data);
  };

  ws.onerror = () => {
    setStatus('error', 'error de conexión');
  };

  ws.onclose = () => {
    setStatus('', 'desconectado');
    wsReconnectTimer = setTimeout(() => { if (cfg.url) connect(); }, 5000);
  };
}

function sendToWs(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showToast('⚠ Sin conexión con el gateway');
    connect();
    return false;
  }
  // Formato flexible — ajusta si OpenClaw espera otro esquema
  const payload = JSON.stringify({ type: 'message', content: text, ...(cfg.apikey ? { api_key: cfg.apikey } : {}) });
  ws.send(payload);
  return true;
}

function handleWsMessage(data) {
  let parsed;
  try { parsed = JSON.parse(data); } catch(e) { parsed = { content: data }; }

  const content = parsed.content || parsed.text || parsed.message || data;
  const isDelta = parsed.type === 'delta' || parsed.streaming === true || parsed.done === false;
  const isDone  = parsed.type === 'done'  || parsed.done === true || parsed.finish_reason;

  if (isDelta) {
    if (!currentAssistantMsg) {
      currentAssistantMsg = appendMsg('assistant', '');
    }
    const bubble = currentAssistantMsg.querySelector('.msg-bubble');
    bubble.textContent += content;
    scrollBottom();
  } else if (isDone) {
    currentAssistantMsg = null;
  } else {
    // Mensaje completo no-streaming
    removeTyping();
    if (currentAssistantMsg) {
      currentAssistantMsg = null;
    }
    appendMsg('assistant', content);
  }
}

// ---- MESSAGES UI ----
function appendMsg(role, text, isVoice = false) {
  const emptyEl = document.getElementById('empty-state');
  if (emptyEl) emptyEl.remove();

  const msgEl = document.createElement('div');
  msgEl.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? 'P' : 'C';

  const body = document.createElement('div');
  body.className = 'msg-body';

  if (isVoice && role === 'user') {
    const badge = document.createElement('div');
    badge.className = 'voice-badge';
    badge.innerHTML = '🎙️ nota de voz';
    body.appendChild(badge);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });

  body.appendChild(bubble);
  body.appendChild(meta);
  msgEl.appendChild(avatar);
  msgEl.appendChild(body);

  document.getElementById('messages').appendChild(msgEl);
  scrollBottom();
  return msgEl;
}

function showTyping() {
  removeTyping();
  const emptyEl = document.getElementById('empty-state');
  if (emptyEl) emptyEl.remove();

  const msgEl = document.createElement('div');
  msgEl.className = 'msg assistant';
  msgEl.id = 'typing-indicator';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = 'C';

  const body = document.createElement('div');
  body.className = 'msg-body';

  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  body.appendChild(dots);
  msgEl.appendChild(avatar);
  msgEl.appendChild(body);
  document.getElementById('messages').appendChild(msgEl);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

// ---- TEXT INPUT ----
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');

textInput.addEventListener('input', () => {
  sendBtn.disabled = textInput.value.trim() === '';
});

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
}

function sendText() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  textInput.style.height = 'auto';
  sendBtn.disabled = true;
  sendMessage(text, false);
}

function sendMessage(text, isVoice) {
  appendMsg('user', text, isVoice);
  showTyping();
  const ok = sendToWs(text);
  if (!ok) removeTyping();
}

// ---- VOICE RECORDING ----
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recognition = null;
let voiceTranscript = '';
const micBtn = document.getElementById('mic-btn');
const transcriptPreview = document.getElementById('transcript-preview');

function startRecording(e) {
  e.preventDefault();
  if (isRecording) return;
  isRecording = true;
  micBtn.classList.add('recording');
  voiceTranscript = '';
  transcriptPreview.textContent = '';
  transcriptPreview.classList.remove('visible');

  // Intentar Web Speech API primero (más rápido en iOS Safari)
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    startSpeechRecognition();
  } else {
    // Fallback: grabar audio y transcribir con Whisper si está disponible
    startAudioCapture();
  }
}

function stopRecording(e) {
  e.preventDefault();
  if (!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');

  if (recognition) {
    recognition.stop();
    recognition = null;
  }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

function startSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = cfg.lang || 'es-ES';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    voiceTranscript += final;
    const display = (voiceTranscript + interim).trim();
    if (display) {
      transcriptPreview.textContent = '🎙️ ' + display;
      transcriptPreview.classList.add('visible');
    }
  };

  recognition.onend = () => {
    if (!isRecording && voiceTranscript.trim()) {
      const text = voiceTranscript.trim();
      transcriptPreview.classList.remove('visible');
      sendMessage(text, true);
      voiceTranscript = '';
    } else if (!isRecording) {
      transcriptPreview.classList.remove('visible');
      showToast('No se detectó voz');
    }
  };

  recognition.onerror = (e) => {
    console.error('SpeechRecognition error:', e.error);
    if (e.error === 'not-allowed') showToast('⚠ Permite acceso al micrófono');
    else showToast('Error de reconocimiento: ' + e.error);
    isRecording = false;
    micBtn.classList.remove('recording');
  };

  try { recognition.start(); }
  catch(err) { showToast('No se pudo iniciar el micrófono'); }
}

function startAudioCapture() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        transcriptPreview.classList.remove('visible');
        showToast('ℹ Transcripción de audio no disponible sin backend. Usa texto.');
      };
      mediaRecorder.start();
      transcriptPreview.textContent = '🎙️ Grabando…';
      transcriptPreview.classList.add('visible');
    })
    .catch(() => showToast('⚠ Permite acceso al micrófono'));
}

// ---- SETTINGS ----
function openSettings() {
  document.getElementById('cfg-url').value = cfg.url;
  document.getElementById('cfg-apikey').value = cfg.apikey || '';
  document.getElementById('cfg-lang').value = cfg.lang || 'es-ES';
  document.getElementById('settings-overlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}

function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settings-overlay')) closeSettings();
}

function saveSettings() {
  cfg.url = document.getElementById('cfg-url').value.trim();
  cfg.apikey = document.getElementById('cfg-apikey').value.trim();
  cfg.lang = document.getElementById('cfg-lang').value.trim() || 'es-ES';
  saveCfg();
  closeSettings();
  connect();
}

// ---- TOAST ----
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ---- INIT ----
loadCfg();
if (cfg.url) {
  connect();
} else {
  setTimeout(() => {
    showToast('⚙ Configura la URL del gateway');
    setTimeout(openSettings, 800);
  }, 600);
}
</script>
